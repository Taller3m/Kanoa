# Publica el prototipo de juegos en GitHub Pages para que todo el equipo pueda verlo sin instalar nada.
# Se ejecuta en cada push a master o a feature/prototipo-juegos que toque el prototipo, o a mano desde la pestaña Actions.
name: Desplegar prototipo

on:
  push:
    branches: [master, feature/prototipo-juegos]
    paths: ['prototipo-juegos/**', '.github/workflows/deploy-prototipo.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo-juegos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototipo-juegos/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototipo-juegos/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
