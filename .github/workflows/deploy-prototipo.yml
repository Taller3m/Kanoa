# Publica el prototipo de juegos en GitHub Pages para que todo el equipo pueda verlo sin instalar nada.
# Pages sirve la rama gh-pages: este workflow compila prototipo-juegos y reemplaza el contenido de esa rama.
# Se ejecuta en cada push a master o a feature/prototipo-juegos que toque el prototipo, o a mano desde la pestaña Actions.
name: Desplegar prototipo

on:
  push:
    branches: [master, feature/prototipo-juegos]
    paths: ['prototipo-juegos/**', '.github/workflows/deploy-prototipo.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototipo-juegos/package-lock.json
      - name: Compilar
        working-directory: prototipo-juegos
        run: npm ci && npm run build
      - name: Publicar en gh-pages
        working-directory: prototipo-juegos/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Despliega el prototipo (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
